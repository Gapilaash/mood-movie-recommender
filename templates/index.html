<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d11">
<title>Mood Movie Recommender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="nav-bar-left">
  <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark theme">
    <svg id="theme-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>

<div class="nav-bar-right">
  <a href="/watchlist" class="nav-pill" id="watchlist-nav-btn">
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 2a2 2 0 00-2 2v18l8-5 8 5V4a2 2 0 00-2-2H6z"/></svg>
    <span id="watchlist-count-label">Watchlist</span>
  </a>
  <a href="/favorites" class="nav-pill" id="fav-nav-btn">
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C.86 10.2 1.6 6.6 4.6 5.1 7 3.9 9.6 4.7 12 7.3c2.4-2.6 5-3.4 7.4-2.2 3 1.5 3.74 5.1 1.9 7.8C18.7 16.65 12 21 12 21z"/></svg>
    <span id="fav-count-label">Favorites</span>
  </a>
</div>

<header>
  <div class="kicker">Personalized picks</div>
  <h1>Mood Movie<br><em>Recommender</em></h1>
  <p class="subtitle">Tell us how you feel, and we'll find a film to match it.</p>
  <div class="rule"></div>
</header>

<div class="mood-chips">
  <button class="chip" onclick="fillMood('happy & upbeat')">Happy</button>
  <button class="chip" onclick="fillMood('sad and melancholic')">Sad</button>
  <button class="chip" onclick="fillMood('thrilled and excited')">Thrilled</button>
  <button class="chip" onclick="fillMood('romantic and hopeful')">Romantic</button>
  <button class="chip" onclick="fillMood('anxious and stressed')">Anxious</button>
  <button class="chip" onclick="fillMood('bored, need adventure')">Bored</button>
  <button class="chip" onclick="fillMood('nostalgic')">Nostalgic</button>
  <button class="chip" onclick="fillMood('cozy and relaxed')">Cozy</button>
</div>

<main>
  <div class="form-card">
    <label for="mood-input">Your mood</label>
    <div class="input-group">
      <input type="text" id="mood-input" placeholder="e.g. happy and hopeful, or tired after a long week…" autocomplete="off">
      <button type="button" class="mic-btn" id="mic-btn" onclick="toggleVoiceInput()" title="Speak your mood">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>
    </div>

    <div class="row">
      <div>
        <label for="language-select">Language</label>
        <select id="language-select">
          <option value="Any">Any language</option>
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="Tamil">Tamil</option>
          <option value="Telugu">Telugu</option>
          <option value="Malayalam">Malayalam</option>
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="Korean">Korean</option>
          <option value="Japanese">Japanese</option>
        </select>
      </div>
      <div>
        <label for="count-select">Number of picks</label>
        <select id="count-select">
          <option value="3">3 movies</option>
          <option value="5" selected>5 movies</option>
          <option value="8">8 movies</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top:12px;">
      <div>
        <label for="genre-select">Genre (optional)</label>
        <select id="genre-select">
          <option value="Any">Any genre</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Action">Action</option>
          <option value="Thriller">Thriller</option>
          <option value="Romance">Romance</option>
          <option value="Horror">Horror</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Animation">Animation</option>
          <option value="Documentary">Documentary</option>
          <option value="Mystery">Mystery</option>
        </select>
      </div>
      <div>
        <label for="decade-select">Decade (optional)</label>
        <select id="decade-select">
          <option value="Any">Any decade</option>
          <option value="2020s">2020s</option>
          <option value="2010s">2010s</option>
          <option value="2000s">2000s</option>
          <option value="1990s">1990s</option>
          <option value="1980s">1980s</option>
          <option value="Before 1980">Before 1980</option>
        </select>
      </div>
    </div>

    <button class="btn" id="submit-btn" onclick="getRecommendations()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>
      Find movies for my mood
    </button>
    <div class="error-box" id="error"></div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Matching your mood to films…</p>
  </div>

  <div id="results"></div>

  <div class="history-section" id="history-section" style="display:none">
    <div class="history-title">Recent searches</div>
    <div class="history-list" id="history-list"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='common.js') }}"></script>
<script>
  const LOADING_MSGS = [
    'Matching your mood to films…',
    'Consulting the cinema archive…',
    'Scanning through the reels…',
    'Almost ready with your picks…',
  ];

  let historyArr = JSON.parse(localStorage.getItem('mmr_history') || '[]');
  let ratingsObj = JSON.parse(localStorage.getItem('mmr_ratings') || '{}');
  let currentMovies = [];
  let currentMood = '';

  renderHistory();

  // ---------- Voice input (Web Speech API) ----------
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (!SpeechRecognitionCtor) {
    const micBtn = document.getElementById('mic-btn');
    if (micBtn) { micBtn.disabled = true; micBtn.title = 'Voice input not supported in this browser'; }
  }

  function toggleVoiceInput() {
    if (!SpeechRecognitionCtor) return;
    const micBtn = document.getElementById('mic-btn');
    const input = document.getElementById('mood-input');

    if (isListening) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
    };
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      input.value = transcript;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      input.focus();
    };
    recognition.onerror = () => {
      showToast('Could not hear you — try again');
    };
    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };

    recognition.start();
  }

  // ---------- Favorites (this page only saves/removes from the movie
  // cards — browsing/removing the full list happens on /favorites) ----------
  function toggleFavorite(i) {
    const m = currentMovies[i];
    if (!m) return;
    if (isFavorited(m)) {
      favoritesArr = favoritesArr.filter(f => movieKey(f) !== movieKey(m));
      showToast('Removed from favorites');
    } else {
      favoritesArr = [{ ...m, savedMood: currentMood }, ...favoritesArr];
      showToast('Saved to favorites');
    }
    localStorage.setItem('mmr_favorites', JSON.stringify(favoritesArr));
    updateFavCount();
    renderResults();
  }

  // ---------- Watchlist (full list lives on /watchlist) ----------
  function toggleWatchlist(i) {
    const m = currentMovies[i];
    if (!m) return;
    if (isInWatchlist(m)) {
      watchlistArr = watchlistArr.filter(w => movieKey(w) !== movieKey(m));
      showToast('Removed from watchlist');
    } else {
      watchlistArr = [{ ...m, savedMood: currentMood }, ...watchlistArr];
      showToast('Added to watchlist');
    }
    localStorage.setItem('mmr_watchlist', JSON.stringify(watchlistArr));
    updateWatchlistCount();
    renderResults();
  }

  // ---------- Ratings (thumbs up/down)  ---------- ----------
  function rateMovie(i, rating) {
    const m = currentMovies[i];
    if (!m) return;
    const key = movieKey(m);
    const current = ratingsObj[key];
    ratingsObj[key] = current === rating ? null : rating;
    if (!ratingsObj[key]) delete ratingsObj[key];
    localStorage.setItem('mmr_ratings', JSON.stringify(ratingsObj));
    renderResults();

    if (ratingsObj[key]) {
      fetch('/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: m.title, rating: ratingsObj[key], mood: currentMood })
      }).catch(() => {});
    }
  }

  function fillMood(text) {
    document.getElementById('mood-input').value = text;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('mood-input').focus();
  }

  function renderHistory() {
    if (!historyArr.length) return;
    document.getElementById('history-section').style.display = 'block';
    document.getElementById('history-list').innerHTML = historyArr.slice(0, 8).map(h =>
      `<button class="history-chip" onclick="fillFromHistory('${h.replace(/'/g,"\\'")}')">${h}</button>`
    ).join('');
  }

  function fillFromHistory(mood) { document.getElementById('mood-input').value = mood; }

  function addToHistory(mood) {
    historyArr = [mood, ...historyArr.filter(h => h !== mood)].slice(0, 8);
    localStorage.setItem('mmr_history', JSON.stringify(historyArr));
    renderHistory();
  }

  function cycleLoading() {
    let i = 0;
    return setInterval(() => {
      i = (i + 1) % LOADING_MSGS.length;
      document.getElementById('loading-text').textContent = LOADING_MSGS[i];
    }, 1800);
  }

  async function getRecommendations(isRegenerate) {
    const mood = document.getElementById('mood-input').value.trim();
    const language = document.getElementById('language-select').value;
    const count = document.getElementById('count-select').value;
    const genre = document.getElementById('genre-select').value;
    const decade = document.getElementById('decade-select').value;
    const errorEl = document.getElementById('error');
    const resultsEl = document.getElementById('results');
    const loadingEl = document.getElementById('loading');
    const btn = document.getElementById('submit-btn');

    errorEl.style.display = 'none';

    if (!mood) {
      errorEl.textContent = "Type how you're feeling, or pick a mood above.";
      errorEl.style.display = 'block';
      return;
    }

    if (!isRegenerate) resultsEl.innerHTML = '';
    btn.disabled = true;
    loadingEl.style.display = 'block';
    const timer = cycleLoading();

    const payload = { mood, language, count: parseInt(count), genre, decade };
    if (isRegenerate) payload.exclude = currentMovies.map(m => m.title);

    try {
      const res = await fetch('/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      clearInterval(timer);
      loadingEl.style.display = 'none';
      btn.disabled = false;

      if (data.error) { errorEl.textContent = data.error; errorEl.style.display = 'block'; return; }

      const movies = JSON.parse(data.result);
      currentMovies = movies;
      currentMood = mood;
      addToHistory(mood);

      renderResults();
      resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      clearInterval(timer);
      loadingEl.style.display = 'none';
      btn.disabled = false;
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
    }
  }

  function regenerate() { getRecommendations(true); }

  function handlePosterError(imgEl) {
    // Poster URL existed but the image itself failed to load (broken/expired
    // link from OMDb). Swap it for the same placeholder used when there's
    // no poster URL at all, instead of showing a broken-image icon.
    const placeholder = document.createElement('div');
    placeholder.className = 'movie-poster placeholder';
    placeholder.textContent = 'No poster';
    imgEl.replaceWith(placeholder);
  }

  function renderResults() {
    const resultsEl = document.getElementById('results');
    const movies = currentMovies;

    let html = `<div class="results-header"><span>${movies.length} picks for "${currentMood}"</span><button class="clear-btn" onclick="clearResults()">Clear</button></div>`;
    movies.forEach((m, i) => {
      const posterHtml = m.poster_url
        ? `<img class="movie-poster" src="${m.poster_url}" alt="${m.title} poster" loading="lazy" onerror="handlePosterError(this)">`
        : `<div class="movie-poster placeholder">No poster</div>`;

      const castHtml = (m.cast && m.cast.length)
        ? `<div class="movie-cast"><b>Cast:</b> ${m.cast.join(', ')}</div>`
        : '';

      const trailerHtml = m.trailer_url
        ? `<a class="trailer-link" href="${m.trailer_url}" target="_blank" rel="noopener">
             <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
             Search trailer
           </a>`
        : '';

      const providersHtml = (m.watch_providers && m.watch_providers.length)
        ? `<div class="watch-providers">
             <span class="watch-label">Watch on:</span>
             ${m.watch_providers.slice(0, 4).map(p => `<span class="provider-tag">${p}</span>`).join('')}
           </div>`
        : '';

      const ratingHtml = m.imdb_rating
        ? `<span class="provider-tag">⭐ ${m.imdb_rating} IMDb</span>`
        : '';

      const key = movieKey(m);
      const saved = isFavorited(m);
      const inWatchlist = isInWatchlist(m);
      const userRating = ratingsObj[key];

      html += `
        <div class="movie-card">
          <div class="movie-num">${i + 1}</div>
          ${posterHtml}
          <div class="movie-body">
            <div class="movie-title">${m.title}</div>
            <div class="movie-meta">
              <span class="genre-tag">${m.genre}</span>
              ${m.year ? `<span class="year-tag">${m.year}</span>` : ''}
            </div>
            <div class="movie-reason">${m.reason}</div>
            ${castHtml}
            <div class="movie-extra-row">
              ${providersHtml}
              ${ratingHtml}
              ${trailerHtml}
            </div>
            <div class="movie-actions-row">
              <button class="icon-btn save-btn ${saved ? 'active' : ''}" title="${saved ? 'Remove from favorites' : 'Save to favorites'}" onclick="toggleFavorite(${i})">
                <svg width="14" height="14" fill="${saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C.86 10.2 1.6 6.6 4.6 5.1 7 3.9 9.6 4.7 12 7.3c2.4-2.6 5-3.4 7.4-2.2 3 1.5 3.74 5.1 1.9 7.8C18.7 16.65 12 21 12 21z"/></svg>
              </button>
              <button class="icon-btn watchlist-btn ${inWatchlist ? 'active' : ''}" title="${inWatchlist ? 'Remove from watchlist' : 'Add to watchlist'}" onclick="toggleWatchlist(${i})">
                <svg width="14" height="14" fill="${inWatchlist ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2a2 2 0 00-2 2v18l8-5 8 5V4a2 2 0 00-2-2H6z"/></svg>
              </button>
              <button class="icon-btn rate-up ${userRating === 'up' ? 'active' : ''}" title="Good pick" onclick="rateMovie(${i}, 'up')">
                <svg width="14" height="14" fill="${userRating === 'up' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/></svg>
              </button>
              <button class="icon-btn rate-down ${userRating === 'down' ? 'active' : ''}" title="Not for me" onclick="rateMovie(${i}, 'down')">
                <svg width="14" height="14" fill="${userRating === 'down' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/></svg>
              </button>
              <div class="actions-spacer"></div>
              <button class="icon-btn share-btn" title="Share this pick" onclick="shareMovie(${i})">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
              </button>
            </div>
          </div>
        </div>`;
    });

    html += `
      <div class="card-actions">
        <button class="ghost-btn" onclick="regenerate()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Regenerate
        </button>
        <button class="ghost-btn" onclick="copyList()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy list
        </button>
        <button class="ghost-btn" onclick="shareList()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
          Share
        </button>
      </div>`;

    resultsEl.innerHTML = html;
  }

  function clearResults() { document.getElementById('results').innerHTML = ''; currentMovies = []; }

  function copyList() {
    if (!currentMovies.length) return;
    const text = currentMovies.map((m, i) => {
      let line = `${i+1}. ${m.title} (${m.genre})\n   ${m.reason}`;
      if (m.watch_providers && m.watch_providers.length) line += `\n   Watch on: ${m.watch_providers.join(', ')}`;
      if (m.trailer_url) line += `\n   Trailer: ${m.trailer_url}`;
      return line;
    }).join('\n\n');
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
  }

  function shareMovie(i) {
    const m = currentMovies[i];
    if (!m) return;
    const text = `${m.title}${m.year ? ` (${m.year})` : ''} — ${m.reason}${m.trailer_url ? `\n${m.trailer_url}` : ''}`;
    if (navigator.share) navigator.share({ title: m.title, text }).catch(() => {});
    else navigator.clipboard.writeText(text).then(() => showToast('Copied — paste to share!'));
  }

  function shareList() {
    const mood = document.getElementById('mood-input').value.trim();
    if (!currentMovies.length) return;
    const text = `Movies for when you're feeling "${mood}":\n\n` + currentMovies.map((m,i) => `${i+1}. ${m.title}`).join('\n');
    if (navigator.share) navigator.share({ title: 'My movie picks', text }).catch(() => {});
    else navigator.clipboard.writeText(text).then(() => showToast('Copied — paste to share!'));
  }

  document.getElementById('mood-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') getRecommendations();
  });
  document.getElementById('mood-input').addEventListener('input', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  });
</script>
</body>
</html>
